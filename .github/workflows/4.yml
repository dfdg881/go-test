name: Android SO Reverse Engineering

on:
  workflow_dispatch:
    inputs:
      so_file_url:
        description: 'URL to libil2cpp.so file'
        required: true
      search_string:
        description: 'String to search'
        default: 'unity.cloud_userid'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            radare2 \
            binwalk \
            xxd \
            file \
            python3-pip \
            unzip \
            wget
          pip3 install frida-tools
          
          # 下载 Ghidra (可选，需要较长时间)
          # wget https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.0.3_build/ghidra_11.0.3_PUBLIC_20240410.zip
          # unzip ghidra_11.0.3_PUBLIC_20240410.zip

      - name: Download SO File
        run: |
          wget -O target.so "${{ inputs.so_file_url }}"
          file target.so
          ls -la target.so

      - name: Extract Strings
        run: |
          strings target.so | grep -E "unity|device|cloud|uuid|install|session|fingerprint|android" > strings_filtered.txt
          echo "=== Found Strings ==="
          cat strings_filtered.txt

      - name: Radare2 Analysis
        run: |
          r2 -q -c "aaa; / ${{ inputs.search_string }}" target.so > r2_search.txt || true
          r2 -q -c "iI" target.so > r2_info.txt
          r2 -q -c "iE" target.so > r2_exports.txt
          r2 -q -c "ii" target.so > r2_imports.txt
          echo "=== Binary Info ==="
          cat r2_info.txt

      - name: Hex Dump Headers
        run: |
          xxd -l 256 target.so > header.txt
          cat header.txt

      - name: Find AES/RSA Constants
        run: |
          # AES S-box
          strings -t x target.so | grep -i "63 7c 77 7b" > crypto_constants.txt || echo "No AES S-box found" >> crypto_constants.txt
          # RSA exponents
          strings -t x target.so | grep "10001" >> crypto_constants.txt || echo "No RSA exponent found" >> crypto_constants.txt
          cat crypto_constants.txt

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: |
            strings_filtered.txt
            r2_*.txt
            crypto_constants.txt
            header.txt
